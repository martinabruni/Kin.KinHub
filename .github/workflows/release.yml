name: Release dev

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'scripts/**'
      - 'VERSION'
      - 'KinHub.slnx'
      - '**/*.csproj'
      - 'Directory.*'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: kinhub-dev-release
  cancel-in-progress: false

jobs:
  infrastructure-gate:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.gate.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check infrastructure prerequisite
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          requires_infrastructure=false
          while IFS= read -r path; do
            case "$path" in
              infra/*|.github/workflows/infrastructure.yml)
                requires_infrastructure=true
                break
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r -m "$GITHUB_SHA")

          # The release workflow is also triggered by application-only pushes.
          # Mixed commits must wait for the infrastructure run for this SHA.
          echo "required=$requires_infrastructure" >> "$GITHUB_OUTPUT"
          if [[ "$requires_infrastructure" != true ]]; then
            exit 0
          fi

          for attempt in {1..60}; do
            runs=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/infrastructure.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10")
            status=$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
            ' <<< "$runs")

            case "$status" in
              completed:success)
                echo "Infrastructure run for $GITHUB_SHA completed successfully."
                exit 0
                ;;
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                echo "Infrastructure run for $GITHUB_SHA ended with $status; release blocked." >&2
                exit 1
                ;;
              missing|queued:*|in_progress:*)
                echo "Waiting for infrastructure run for $GITHUB_SHA ($status, attempt $attempt/60)."
                sleep 30
                ;;
              *)
                echo "Unexpected infrastructure run state for $GITHUB_SHA: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Infrastructure run for $GITHUB_SHA did not complete within 30 minutes." >&2
          exit 1

  release:
    needs: infrastructure-gate
    if: needs.infrastructure-gate.result == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Build backend and migration bundle
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore -p:CommitSha="${GITHUB_SHA::12}" -p:BuildDate="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -p:BuildEnvironment=CI
          dotnet test KinHub.slnx --configuration Release --no-build
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle --project src/backend/infrastructure/DA.KinHub.Infrastructure --configuration Release --force --output artifacts/migrations/kinhub-migrations
      - name: Package backend without recompiling
        id: package_backend
        env:
          SKIP_BUILD: 'true'
        run: |
          set -euo pipefail
          backend_zip=$(bash scripts/package-backend.sh CI | tee "$RUNNER_TEMP/backend-package.log" | tail -n 1)
          test -f "$backend_zip"
          echo "zip_path=$backend_zip" >> "$GITHUB_OUTPUT"
      - name: Build frontend and metadata
        env:
          VITE_API_BASE_URL: /api
          VITE_ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          VITE_ENTRA_FRONTEND_CLIENT_ID: ${{ secrets.ENTRA_FRONTEND_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_INSTANCE }}
        run: |
          npm ci --prefix src/frontend
          npm run --prefix src/frontend test
          npm run --prefix src/frontend lint
          npm run --prefix src/frontend typecheck
          npm run --prefix src/frontend i18n:validate
          npm run --prefix src/frontend routes:validate
          npm run --prefix src/frontend design-system:validate
          npm run --prefix src/frontend build
          sha256sum artifacts/backend/*.zip > artifacts/backend/checksums.txt
          printf '{"commitSha":"%s","runId":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/release-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kinhub-release-${{ github.sha }}
          path: |
            artifacts/backend
            artifacts/migrations/kinhub-migrations
            artifacts/release-metadata.json
            src/frontend/dist
          retention-days: 30
      - name: Azure login with OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read ARM deployment outputs
        id: arm
        shell: bash
        run: |
          outputs=$(az deployment group show --name kinhub-dev-infrastructure --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.outputs --only-show-errors --output json)
          for key in functionAppName functionAppHostname functionAppPrincipalId sqlServerName sqlServerFqdn sqlDatabaseName staticWebAppName staticWebAppHostname; do
            value=$(jq -r ".${key}.value // empty" <<< "$outputs")
            test -n "$value"
            echo "${key}=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Open temporary Azure SQL firewall rule
        id: firewall
        shell: bash
        run: |
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          subscription_id=$(az account show --query id --output tsv)
          rule_name="gha-${GITHUB_RUN_ID}"
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Sql/servers/${{ steps.arm.outputs.sqlServerName }}/firewallRules/${rule_name}?api-version=2021-11-01"
          az rest --method put --url "$rule_url" --body "{\"properties\":{\"startIpAddress\":\"${runner_ip}\",\"endIpAddress\":\"${runner_ip}\"}}" --only-show-errors --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"
      - name: Provision database principals and runtime grants
        shell: bash
        run: |
          sql_token=$(az account get-access-token --resource https://database.windows.net/ --query accessToken --output tsv)
          management_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          admin_object_id=$(node -e "const token=process.argv[1].split('.')[1]; const normalized=token.replace(/-/g,'+').replace(/_/g,'/'); const padded=normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='); const payload=JSON.parse(Buffer.from(padded, 'base64').toString('utf8')); process.stdout.write(payload.oid ?? '');" "$management_token")
          guid_to_sql_sid() {
            node -e "const guid=process.argv[1].replace(/-/g,''); const bytes=[guid.slice(6,8),guid.slice(4,6),guid.slice(2,4),guid.slice(0,2),guid.slice(10,12),guid.slice(8,10),guid.slice(14,16),guid.slice(12,14),guid.slice(16,18),guid.slice(18,20),guid.slice(20,22),guid.slice(22,24),guid.slice(24,26),guid.slice(26,28),guid.slice(28,30),guid.slice(30,32)]; process.stdout.write('0x' + bytes.join(''));" "$1"
          }
          app_sid=$(guid_to_sql_sid "${{ steps.arm.outputs.functionAppPrincipalId }}")
          migrator_sid=$(guid_to_sql_sid "$admin_object_id")
          pwsh -NoLogo -NoProfile -Command "Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber; Import-Module SqlServer; Invoke-Sqlcmd -ServerInstance 'tcp:${{ steps.arm.outputs.sqlServerFqdn }},1433' -Database '${{ steps.arm.outputs.sqlDatabaseName }}' -AccessToken '$sql_token' -Query \"IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'kinhub_app') CREATE USER [kinhub_app] WITH SID = $app_sid, TYPE = E; IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'kinhub_migrator') CREATE USER [kinhub_migrator] WITH SID = $migrator_sid, TYPE = E; GRANT SELECT, INSERT, UPDATE, DELETE ON SCHEMA::shared TO [kinhub_app]; GRANT SELECT, INSERT, UPDATE, DELETE ON SCHEMA::kinlist TO [kinhub_app]; GRANT EXECUTE TO [kinhub_app]; ALTER ROLE db_datareader ADD MEMBER [kinhub_migrator]; ALTER ROLE db_datawriter ADD MEMBER [kinhub_migrator]; ALTER ROLE db_ddladmin ADD MEMBER [kinhub_migrator];\""
      - name: Apply migration bundle
        run: |
          artifacts/migrations/kinhub-migrations --connection "Server=tcp:${{ steps.arm.outputs.sqlServerFqdn }},1433;Database=${{ steps.arm.outputs.sqlDatabaseName }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False"
      - name: Close temporary Azure SQL firewall rule
        if: always() && steps.firewall.outputs.rule_name != ''
        shell: bash
        run: |
          subscription_id=$(az account show --query id --output tsv)
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Sql/servers/${{ steps.arm.outputs.sqlServerName }}/firewallRules/${{ steps.firewall.outputs.rule_name }}?api-version=2021-11-01"
          az rest --method delete --url "$rule_url" --only-show-errors --output none
      - name: Deploy Function with One Deploy
        uses: Azure/functions-action@c9cc8ee93d1285e2a17312cc8357dc1775955272 # v1
        with:
          app-name: ${{ steps.arm.outputs.functionAppName }}
          package: ${{ steps.package_backend.outputs.zip_path }}
          sku: flexconsumption
          remote-build: false
      - name: Read Static Web Apps deployment token
        id: static_web_app_token
        shell: bash
        run: |
          deployment_token=$(az staticwebapp secrets list --name "${{ steps.arm.outputs.staticWebAppName }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.apiKey --only-show-errors --output tsv)
          test -n "$deployment_token"
          echo "::add-mask::$deployment_token"
          echo "deployment_token=$deployment_token" >> "$GITHUB_OUTPUT"
      - name: Deploy Static Web App without rebuilding
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static_web_app_token.outputs.deployment_token }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          output_location: ''
      - name: Smoke test release
        shell: bash
        env:
          FUNCTION_HEALTH_URL: https://${{ steps.arm.outputs.functionAppHostname }}/health/live
          STATIC_ROOT_URL: https://${{ steps.arm.outputs.staticWebAppHostname }}/
          STATIC_VERSION_URL: https://${{ steps.arm.outputs.staticWebAppHostname }}/api/version
        run: |
          set -euo pipefail
          node scripts/smoke-test-release.mjs
